<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse — {% block title %}Social Network{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100">
    <nav class="bg-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-8">
                    <a href="/" class="text-2xl font-bold text-purple-600"><i class="fas fa-waveform"></i> Pulse</a>
                    {% if session.user_id %}
                    <a href="/" class="text-gray-700 hover:text-purple-600"><i class="fas fa-home"></i> Home</a>
                    <a href="/profile" class="text-gray-700 hover:text-purple-600"><i class="fas fa-user"></i> Profile</a>
                    {% endif %}
                </div>
                <div class="flex items-center space-x-4">
                    {% if session.user_id %}
                    <span class="text-gray-600">@{{ session.username }}</span>
                    <a href="/logout" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>
                    {% else %}
                    <a href="/login" class="text-purple-600 hover:text-purple-700">Login</a>
                    <a href="/register" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 transition">
                        Register
                    </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-2xl mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
