{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="bg-white rounded-xl shadow-md p-8 max-w-md mx-auto">
    <h2 class="text-2xl font-bold text-center mb-6">Join Pulse</h2>
    {% if error %}
    <div class="bg-red-100 text-red-700 p-3 rounded-lg mb-4">{{ error }}</div>
    {% endif %}
    <form method="POST">
        <input type="text" name="username" placeholder="Username" required
               class="w-full p-3 border rounded-lg mb-4 focus:outline-none focus:border-purple-500">
        <input type="password" name="password" placeholder="Password" required
               class="w-full p-3 border rounded-lg mb-4 focus:outline-none focus:border-purple-500">
        <button type="submit" class="w-full bg-purple-600 text-white py-3 rounded-lg hover:bg-purple-700 transition">
            Register
        </button>
    </form>
    <p class="text-center mt-4 text-gray-600">Already have an account? <a href="/login" class="text-purple-600">Login</a></p>
</div>
{% endblock %}
